<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .sidebar {
            height: 100vh;
            background-color: #0f172a;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4 >{{user_name || "Company Panel"}}</h4>
            <hr>
            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="edit-drive2.html">Drives</a>
            <a href="company-profile.html">Profile</a>
            
        </div>

        <div class="col-md-10 p-4">
            <h2>Company Dashboard</h2>
            <hr>
             <p>{{message}}</p>
           
            <h2>On Going Drive</h2>
            <div class="companydrive">
                <span  v-for= "d in drives" :key="d.drive_id">
                    
                    <p><a :href="'drive.html?id=' + d.drive_id">{{d.Name}}</a></p>
                    
                </span>
            </div>
            

        <h4>Student Applications</h4>
        
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>CGPA</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                
                <tr v-for="st in student_applications">
                    <td>{{ st.name }}</td>
                    <td>{{ st.branch }}</td>
                    <td>{{ st.cgpa }}</td>
                    <td>{{ st.status }}</td>
                </tr>
                
            </tbody>
        </table>
        

                </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/scripts/company-dash.js">
    
</script>
</body>
</html>
