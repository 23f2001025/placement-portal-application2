<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
        }
        .register-card {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.08);
        }
        .error{
            color: red;
            font-weight: bold;
        }
        .success{
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="register-card" id="app">
    <h3 class="text-center mb-4">Company Registration</h3>

    <form @submit.prevent="register">
        <div class="mb-3">
            <label class="form-label">Company Name</label>
            <input type="text" class="form-control" v-model="company_name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">HR Email</label>
            <input type="email" class="form-control" v-model="hr_email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">HR Name</label>
            <input type="text" class="form-control" v-model="hr_name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" v-model="password1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" v-model="password2" required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Register</button>
        </div>

       
        <p v-if="message.length">{{ message }}</p>
                    

        <p class="text-center mt-3">
            Already registered? <a href="#">Login here</a>
        </p>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/scripts/company-registration.js">
    
</script>
</body>
</html>
