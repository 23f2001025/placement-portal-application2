<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
        }
        .register-card {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.08);
        }
        .error{
            color: red;
            font-weight: bold;
        }
        .success{
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="register-card" id="app">
    <h3 class="text-center mb-4">Student Registration</h3>

    <form @submit.prevent="register">
        <div class="mb-3">
            <label class="form-label">Enrollment Number</label>
            <input type="text" class="form-control" v-model="enroll_no" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email ID</label>
            <input type="text" class="form-control" v-model="mail_id" required>
        </div>


        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" v-model="password1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" v-model="password2" required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Register</button>
        </div>

        
        <p v-if="message.length">{{ message }}</p>
                    
        <p class="text-center mt-3">
            Already registered? <a href="#">Login here</a>
        </p>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script>
const {createApp} = Vue;
    createApp({
        data(){
            return {
                enroll_no:"",
                mail_id:"",
                password1:"",
                password2:"",
                message:"",
            }
        },
        methods:{
            async register(){
                try{
                    if(this.password1 != this.password2){
                        this.message = "Passwords mismatch";
                        return;
                    }
                    
                    
                    const res = await fetch(`http://127.0.0.1:5000/student/register`,{
                        method:'POST',
                        headers:{
                            'Content-Type':'Application/json'
                        },
                        body:JSON.stringify({
                            "enroll_no":this.enroll_no,
                            "mail_id":this.mail_id,
                            "password1":this.password1,
                            "password2":this.password2,
                        })
                    });
                   
                    if(!res.ok) throw new Error("Registration failed");
                    const data = await res.json();
                    if(!data.success) throw new Error("Registratoin failed "+data.message);
                    this.message = data.message;
                    window.location.href = 'studentlogin.html';
                }catch(err){
                    this.message = err;
                    console.log(err);

                }
            }
        }
    }).mount("#app");
</script>
</body>
</html>
