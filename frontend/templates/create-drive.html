<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Placement Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .sidebar {
            height: 100vh;
            background-color: #0f172a;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #1e293b;
        }
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.08);
        }
        .error{
            color: red;
            font-weight: bold;
        }
        .success{
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>
            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="company-profile.html">Profile</a>
        </div>

        <div class="col-md-10 p-4">
            <h2>Create Placement Drives</h2>
            <hr>
             <p class="error" v-if="message.length">{{ message }}</p>
             
            <form @submit.prevent="createDrive">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" v-model="job_title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Package</label>
                    <input type="text" class="form-control" v-model="package" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">CGPA Required</label>
                    <input type="text" class="form-control" v-model="cutoff_cgpa" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">location</label>
                    <input type="text" class="form-control" v-model="location" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Allowed Branches</label>
                    <input type="text" class="form-control" v-model="branches" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Deadline</label>
                    <input type="text" class="form-control" v-model="deadline" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="text" class="form-control" v-model="drive_date" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" class="form-control" v-model="description" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rounds</label>
                    <input type="text" class="form-control" v-model="Round_Description" required>
                </div>


                <div class="d-grid">
                    <button type="submit" class="btn btn-success">Create</button>
                </div>
            </form>


            <template v-if="drives.length">
            <h2>On Going Drive</h2>
           
            <div class="companydrive">
                <span>
                    <p v-for="d in drives" :key="d.drive_id"><a :href="'/drive-page?id=' + d.drive_id">{{d.Name}}</a></p>
                </span>
            </div>
            </template>
            <p v-else>No drives</p>
            

            

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script>
    const {createApp} = Vue
    createApp({
        data(){
            return {
                user_name:"",
                drives:[],
                message:"",
                job_title:"",
                package:"",
                cutoff_cgpa:"",
                location:"",
                branches:"",
                deadline:"",
                drive_date:"",
                description:"",
                Round_Description:"",
            }
        },
        created(){
            this.fetchCreateDriveData();
        },
        methods:{
            async fetchCreateDriveData(){
                try{
                    const res = await fetch(`http://127.0.0.1:5000/company/create-drive`,{
                        credentials:"include",
                    });
                    if(!res.ok) throw new Error("Failed to fetch data");
                    const data = await res.json();
                    this.user_name = data.user_name;
                    this.drives = data.drives;
                }catch(err){
                    console.log(err);
                }
            },
            async createDrive(){
                try{
                    const formData = new FormData();
                    formData.append("job_title", this.job_title);
                    formData.append("package", this.package);
                    formData.append("cutoff-cgpa", this.cutoff_cgpa);
                    formData.append("location", this.location);
                    formData.append("branches", this.branches);
                    formData.append("deadline", this.deadline);
                    formData.append("drive-date", this.drive_date);
                    formData.append("description", this.description);
                    formData.append("Round-Description", this.Round_Description);
                    const res = await fetch(`http://127.0.0.1:5000/company/create-drive`,{
                        method:"POST",
                        credentials:"include",
                        body: formData,
                    });
                    const data = await res.json();
                    if(!res.ok || !data.success) throw new Error(data.message || "Failed to create drive");
                    this.message = "";
                    this.job_title = "";
                    this.package = "";
                    this.cutoff_cgpa = "";
                    this.location = "";
                    this.branches = "";
                    this.deadline = "";
                    this.drive_date = "";
                    this.description = "";
                    this.Round_Description = "";
                    this.fetchCreateDriveData();
                }catch(err){
                    this.message = err.message;
                    console.log(err);
                }
            }
        }
    }).mount("#app");
</script>

</body>
</html>
