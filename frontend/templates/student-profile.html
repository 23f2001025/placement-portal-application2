<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; }
        .sidebar {
            height: 100vh;
            background-color: #1e40af;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #1d4ed8;
        }
        .error   { color: red;   font-weight: bold; }
        .success { color: green; font-weight: bold; }

       
        .toggle-checkbox { display: none; }
        .edit-form {
            display: none;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 14px 16px;
            margin-top: 6px;
        }
        .toggle-checkbox:checked ~ .info-row .edit-label { display: none; }
        .toggle-checkbox:checked ~ .edit-form { display: block; }

        .info-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .info-label {
            width: 160px;
            font-weight: 600;
            color: #475569;
            flex-shrink: 0;
        }
        .info-value { flex: 1; }
        .edit-label {
            color: #2563eb;
            cursor: pointer;
            font-size: 0.875rem;
            text-decoration: underline;
            margin-left: 16px;
        }
        .edit-label:hover { color: #1d4ed8; }
        .cancel-label {
            color: #64748b;
            cursor: pointer;
            font-size: 0.875rem;
            text-decoration: underline;
            margin-left: 10px;
        }
        .cancel-label:hover { color: #1e293b; }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

       
        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Student Panel"}}</h4>
            <hr>
            <a href="student-dash.html">Dashboard</a>
            <a href="student-drive.html">Placement Drives</a>
            <a href="student-application.html">Applications</a>
            <a href="student-profile.html" class="active">Profile</a>
        </div>

        <div class="col-md-10 p-4">
            <h2>My Profile</h2>
            <hr>

            <p :class="messageCategory" v-if="message.length">{{ message }}</p>

            <div class="info-row">
                <span class="info-label">Name</span>
                <span class="info-value">{{ student.name }}</span>
            </div>

          
            <div class="info-row">
                <span class="info-label">Branch</span>
                <span class="info-value">{{ student.branch }}</span>
            </div>

       
            <div class="info-row">
                <span class="info-label">Semester</span>
                <span class="info-value">{{ student.sem }}</span>
            </div>

           
            <div class="info-row">
                <span class="info-label">CGPA</span>
                <span class="info-value">{{ student.cgpa }}</span>
            </div>

          
            <div class="info-row">
                <span class="info-label">Blacklisted</span>
                <span class="info-value">
                    <span class="badge bg-danger" v-if="student.is_blacklisted">Yes</span>
                    <span class="badge bg-success" v-else>No</span>
                </span>
            </div>

          
            <input type="checkbox" class="toggle-checkbox" id="edit-email">

            <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value">
                    <span v-if="student.email">{{ student.email }}</span>
                    <span class="text-muted" v-else>Not provided</span>
                </span>
                <label class="edit-label" for="edit-email">Edit</label>
            </div>

            <div class="edit-form">
                <form method="POST" action="/student/profile" @submit.prevent="updateEmail">
                    <label class="form-label fw-semibold mb-1">Email Address</label>
                    <input type="email"
                           class="form-control form-control-sm mb-2"
                           name="email"
                           placeholder="Enter new email"
                           v-model="emailInput"
                           required>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                    <label class="cancel-label" for="edit-email">Cancel</label>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/scripts/student-profile.js">
    
</script>
</body>
</html>
