<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Placement Drives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; }
        .sidebar {
            height: 100vh;
            background-color: #1e40af;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #1d4ed8;
        }
        .error   { color: red;   font-weight: bold; }
        .success { color: green; font-weight: bold; }

        
        .toggle-checkbox { display: none; }
        .apply-form {
            display: none;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 14px 16px;
            margin-top: 10px;
        }
        .toggle-checkbox:checked ~ .apply-form { display: block; }

        .apply-label {
            cursor: pointer;
        }
        
        .toggle-checkbox:checked ~ .apply-label { display: none; }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

        
        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Student Panel"}}</h4>
            <hr>
            <a href="student-dash.html">Dashboard</a>
            <a href="student-drive.html">Placement Drives</a>
            <a href="student-application.html">Applications</a>
            <a href="student-profile.html" class="active">Profile</a>
        </div>

     
        <div class="col-md-10 p-4">
            <h2>Placement Drives</h2>

            <p :class="messageCategory" v-if="message.length">{{ message }}</p>

            <table class="table table-bordered mt-3" v-if="drives.length">
                <thead class="table-dark">
                    <tr>
                        <th>Job Title</th>
                        <th>Company</th>
                        <th>Package (LPA)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="d in drives" :key="d.drive_id">
                        <td>
                            <a :href="'drive.html?id=' + d.drive_id">
                                {{ d.job_title }}
                            </a>
                        </td>
                        <td>{{ d.company }}</td>
                        <td>
                            <span v-if="d.package">{{ d.package }} LPA</span>
                            <span v-else>N/A</span>
                        </td>
                        <td>
                           <template v-if="d.status === 'Not Applied'">
                            <input type="checkbox"
                                   class="toggle-checkbox"
                                   :id="'apply-' + d.drive_id">

                            
                            <label class="btn btn-primary btn-sm apply-label"
                                   :for="'apply-' + d.drive_id">
                                Apply
                            </label>

                           
                            <div class="apply-form">
                                <form method="POST"
                                      action="/student/apply"
                                      enctype="multipart/form-data"
                                      @submit.prevent="submitApplication($event, d.drive_id)">
                                    <input type="hidden"
                                           name="drive_id"
                                           :value="d.drive_id">
                                    <div class="mb-2">
                                        <label class="form-label fw-semibold mb-1">
                                            Upload Resume (PDF only)
                                        </label>
                                        <input type="file"
                                               class="form-control form-control-sm"
                                               name="resume"
                                               accept=".pdf"
                                               required>
                                    </div>
                                    <button type="submit"
                                            class="btn btn-success btn-sm">
                                        Submit
                                    </button>
                                    <label class="btn btn-secondary btn-sm"
                                           :for="'apply-' + d.drive_id">
                                        Cancel
                                    </label>
                                </form>
                            </div>
                            </template>
                            <p v-else>Applied</p>

                        </td>
                    </tr>
                </tbody>
            </table>

            <p v-else>No placement drives available right now.</p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script>
    const {createApp} = Vue
    createApp({
        data(){
            return {
                user_name:"",
                drives:[],
                message:"",
                messageCategory:"",
            }
        },
        created(){
            this.fetchDrives();
        },
        methods:{
            async fetchDrives(){
                try{
                    const res = await fetch(`http://127.0.0.1:5000/student/apply`,{
                        credentials:"include",
                    });
                    if(!res.ok) throw new Error("Failed to fetch placement drives");
                    const data = await res.json();
                    this.user_name = data.user_name;
                    this.drives = data.drives;
                }catch(err){
                    this.message = err.message;
                    this.messageCategory = "error";
                    console.log(err);
                }
            },
            async submitApplication(event, drive_id){
                try{
                    const formData = new FormData(event.target);
                    const res = await fetch(`http://127.0.0.1:5000/student/apply`,{
                        method:"POST",
                        credentials:"include",
                        body: formData,
                    });
                    const data = await res.json();
                    if(!res.ok || !data.success) throw new Error(data.message || "Failed to submit application");
                    this.message = data.message;
                    this.messageCategory = "success";
                    this.fetchDrives();
                }catch(err){
                    this.message = err.message;
                    this.messageCategory = "error";
                    console.log(err);
                }
            }
        }
    }).mount("#app");
</script>
</body>
</html>
