<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Drives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; }

        .sidebar {
            height: 100vh;
            background-color: #0f172a;
            color: white;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }

        .sidebar a:hover {
            background-color: #1e293b;
        }
    </style>
</head>

<body>

<div class="container-fluid" id="app">

    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>

            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="edit-drive2.html">Drives</a>
            <a href="company-profile.html">Profile</a>
        </div>


        <div class="col-md-10 p-4">

            <h2>Edit Drives</h2>
            <hr>

            <p v-if="message.length">{{message}}</p>


            <table class="table table-bordered align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Drive Name</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>


                <tbody>

                    <template v-for="d in drives" :key="d.drive_id">

                        <!-- DRIVE ROW -->
                        <tr>

                            <td>{{ d.Title }}</td>

                            <td>
                                <span
                                    class="badge"
                                    :class="d.applications_closed ? 'bg-secondary' : 'bg-success'"
                                >
                                    {{ d.status }}
                                </span>
                            </td>


                            <td class="text-center">

                                <button
                                    class="btn btn-primary btn-sm me-2"
                                    @click="editDrive(d.drive_id)"
                                >
                                    Edit
                                </button>


                                <button
                                    class="btn btn-warning btn-sm me-2"
                                    v-if="!d.applications_closed"
                                    :disabled="d.applications_closed"
                                    @click="closeApplications(d.drive_id)"
                                >
                                    Close Applications
                                </button>


                                <button
                                    class="btn btn-warning btn-sm me-2"
                                    v-else
                                    @click="openApplications(d.drive_id)"
                                >
                                    Open Applications
                                </button>


                                <!-- SCHEDULE INTERVIEW BUTTON -->
                                <button
                                    class="btn btn-success btn-sm me-2"
                                    @click="showScheduleForm(d.drive_id)"
                                >
                                    Schedule Interviews
                                </button>


                                <button
                                    class="btn btn-danger btn-sm"
                                    @click="deleteDrive(d.drive_id)"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>


                        <!-- SCHEDULE INTERVIEW FORM -->
                        <tr v-if="scheduleDriveId === d.drive_id">

                            <td colspan="3">

                                <div class="card p-4">

                                    <h5 class="mb-3">
                                        Schedule Interviews - {{ d.Title }}
                                    </h5>


                                    <form @submit.prevent="scheduleInterviews">

                                        <div class="row">

                                            <!-- DATE -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Interview Date
                                                </label>

                                                <input
                                                    type="date"
                                                    class="form-control"
                                                    v-model="scheduleForm.interview_date"
                                                    required
                                                >

                                            </div>


                                            <!-- START TIME -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Start Time
                                                </label>

                                                <input
                                                    type="time"
                                                    class="form-control"
                                                    v-model="scheduleForm.start_time"
                                                    required
                                                >

                                            </div>


                                            <!-- END TIME -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    End Time
                                                </label>

                                                <input
                                                    type="time"
                                                    class="form-control"
                                                    v-model="scheduleForm.end_time"
                                                    required
                                                >

                                            </div>


                                            <!-- NUMBER OF PANELS -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Number of Panels
                                                </label>

                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    v-model="scheduleForm.number_of_panels"
                                                    min="1"
                                                    required
                                                >

                                            </div>
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Average Interview Time( Minutes)
                                                </label>

                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    v-model="scheduleForm.average_time"
                                                    min="10"
                                                    required
                                                >

                                            </div>

                                        </div>


                                        <button
                                            type="submit"
                                            class="btn btn-success me-2"
                                        >
                                            Schedule
                                        </button>


                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            @click="cancelSchedule"
                                        >
                                            Cancel
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                    </template>


                    <tr v-if="drives.length === 0">

                        <td
                            colspan="3"
                            class="text-center text-muted"
                        >
                            No drives found
                        </td>

                    </tr>

                </tbody>

            </table>
            <div class="card export-card p-4 mb-4">
            <h4>Export Placement Data</h4>
            <p class="text-muted mb-3">
                Generate a CSV report with placement statistics for all your drives.
            </p>

            <button
                class="btn btn-primary"
                :disabled="generatingReport"
                @click="exportReport"
            >
                <span v-if="generatingReport" class="spinner-border spinner-border-sm me-2" role="status"></span>
                {{ generatingReport ? "Generating report..." : "Export Placement Data" }}
            </button>

            <p class="mt-3 mb-0" v-if="message.length">
                {{ message }}
            </p>

            
               
            <button v-if="reportUrl" target="_blank"
                class="btn btn-success btn-sm mt-2" @click="viewReport(reportUrl)">
                                ⬇ Download Report
                            </button>
        </div>


        </div>
        

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>

<script src="/scripts/edit-drive.js">


</script>

</body>
</html>
