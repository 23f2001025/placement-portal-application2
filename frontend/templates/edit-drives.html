<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Drives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8fafc; }

        .sidebar {
            height: 100vh;
            background-color: #0f172a;
            color: white;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }

        .sidebar a:hover {
            background-color: #1e293b;
        }
    </style>
</head>

<body>

<div class="container-fluid" id="app">

    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>

            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="edit-drive.html">Drives</a>
            <a href="company-profile.html">Profile</a>
        </div>


        <div class="col-md-10 p-4">

            <h2>Edit Drives</h2>
            <hr>

            <p v-if="message">{{message}}</p>


            <table class="table table-bordered align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Drive Name</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>


                <tbody>

                    <template v-for="d in drives" :key="d.drive_id">

                        <!-- DRIVE ROW -->
                        <tr>

                            <td>{{ d.Title }}</td>

                            <td>
                                <span
                                    class="badge"
                                    :class="d.applications_closed ? 'bg-secondary' : 'bg-success'"
                                >
                                    {{ d.status }}
                                </span>
                            </td>


                            <td class="text-center">

                                <button
                                    class="btn btn-primary btn-sm me-2"
                                    @click="editDrive(d.drive_id)"
                                >
                                    Edit
                                </button>


                                <button
                                    class="btn btn-warning btn-sm me-2"
                                    v-if="!d.applications_closed"
                                    :disabled="d.applications_closed"
                                    @click="closeApplications(d.drive_id)"
                                >
                                    Close Applications
                                </button>


                                <button
                                    class="btn btn-warning btn-sm me-2"
                                    v-else
                                    @click="openApplications(d.drive_id)"
                                >
                                    Open Applications
                                </button>


                                <!-- SCHEDULE INTERVIEW BUTTON -->
                                <button
                                    class="btn btn-success btn-sm me-2"
                                    @click="showScheduleForm(d.drive_id)"
                                >
                                    Schedule Interviews
                                </button>


                                <button
                                    class="btn btn-danger btn-sm"
                                    @click="deleteDrive(d.drive_id)"
                                >
                                    Delete
                                </button>

                            </td>

                        </tr>


                        <!-- SCHEDULE INTERVIEW FORM -->
                        <tr v-if="scheduleDriveId === d.drive_id">

                            <td colspan="3">

                                <div class="card p-4">

                                    <h5 class="mb-3">
                                        Schedule Interviews - {{ d.Title }}
                                    </h5>


                                    <form @submit.prevent="scheduleInterviews">

                                        <div class="row">

                                            <!-- DATE -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Interview Date
                                                </label>

                                                <input
                                                    type="date"
                                                    class="form-control"
                                                    v-model="scheduleForm.interview_date"
                                                    required
                                                >

                                            </div>


                                            <!-- START TIME -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Start Time
                                                </label>

                                                <input
                                                    type="time"
                                                    class="form-control"
                                                    v-model="scheduleForm.start_time"
                                                    required
                                                >

                                            </div>


                                            <!-- END TIME -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    End Time
                                                </label>

                                                <input
                                                    type="time"
                                                    class="form-control"
                                                    v-model="scheduleForm.end_time"
                                                    required
                                                >

                                            </div>


                                            <!-- NUMBER OF PANELS -->
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Number of Panels
                                                </label>

                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    v-model="scheduleForm.number_of_panels"
                                                    min="1"
                                                    required
                                                >

                                            </div>
                                            <div class="col-md-3 mb-3">

                                                <label class="form-label">
                                                    Average Interview Time( Minutes)
                                                </label>

                                                <input
                                                    type="number"
                                                    class="form-control"
                                                    v-model="scheduleForm.average_time"
                                                    min="10"
                                                    required
                                                >

                                            </div>

                                        </div>


                                        <button
                                            type="submit"
                                            class="btn btn-success me-2"
                                        >
                                            Schedule
                                        </button>


                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            @click="cancelSchedule"
                                        >
                                            Cancel
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                    </template>


                    <tr v-if="drives.length === 0">

                        <td
                            colspan="3"
                            class="text-center text-muted"
                        >
                            No drives found
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>

<script>

const { createApp } = Vue;

createApp({

    data(){

        return {

            drives: [],

            user_name: "",

            message: "",


            // Which drive currently has the schedule form open
            scheduleDriveId: null,


            // Schedule form data
            scheduleForm: {

                interview_date: "",
                start_time: "",
                end_time: "",
                number_of_panels: 1,
                average_time:10,

            }

        }

    },


    created(){

        this.fetchDrives();

    },


    methods: {


        async fetchDrives(){

            try{

                const res = await fetch(
                    `http://127.0.0.1:5000/company/view-drives`,
                    {
                        credentials: 'include'
                    }
                );

                if(!res.ok)
                    throw new Error("something went wrong");

                const data = await res.json();

                if(!data.success)
                    throw new Error(data.message);

                this.drives = data.drives;

                this.user_name = data.user_name;

            }
            catch(err){

                this.message = err.message;

                console.log(err);

            }

        },


        editDrive(driveId){

            window.location.href =
                `add-drivedetails.html?id=${driveId}`;

        },


        async closeApplications(driveId){

            if(!confirm("Close applications for this drive?"))
                return;

            try{

                const res = await fetch(
                    `http://127.0.0.1:5000/company/edit-drives/${driveId}`,
                    {
                        method:'POST',
                        credentials:'include'
                    }
                );

                const data = await res.json();

                if(!data.success)
                    throw new Error(data.message);

                const drive =
                    this.drives.find(d => d.drive_id === driveId);

                if(drive)
                    drive.applications_closed = true;

                this.message =
                    "Applications closed successfully";

                this.fetchDrives();

            }
            catch(err){

                this.message = err.message;

                console.log(err);

            }

        },


        async openApplications(driveId){

            if(!confirm("Open applications for this drive?"))
                return;

            try{

                const res = await fetch(
                    `http://127.0.0.1:5000/company/edit-drives/open/${driveId}`,
                    {
                        method:'PUT',
                        credentials:'include'
                    }
                );

                const data = await res.json();

                if(!data.success)
                    throw new Error(data.message);

                const drive =
                    this.drives.find(d => d.drive_id === driveId);

                if(drive)
                    drive.applications_closed = true;

                this.message =
                    "Applications Opened successfully";

                this.fetchDrives();

            }
            catch(err){

                this.message = err.message;

                console.log(err);

            }

        },


        async deleteDrive(driveId){

            if(!confirm(
                "Are you sure you want to delete this drive? This cannot be undone."
            ))
                return;

            try{

                const res = await fetch(
                    `http://127.0.0.1:5000/company/edit-drives/${driveId}`,
                    {
                        method:'DELETE',
                        credentials:'include'
                    }
                );

                const data = await res.json();

                if(!data.success)
                    throw new Error(data.message);

                this.drives =
                    this.drives.filter(
                        d => d.drive_id !== driveId
                    );

                this.message =
                    "Drive deleted successfully";

            }
            catch(err){

                this.message = err.message;

                console.log(err);

            }

        },


        // ==========================================
        // INTERVIEW SCHEDULING
        // ==========================================


        showScheduleForm(driveId){

            // If clicking the same button again,
            // close the form
            if(this.scheduleDriveId === driveId){

                this.scheduleDriveId = null;

                return;

            }


            // Open form for this drive
            this.scheduleDriveId = driveId;


            // Reset form
            this.scheduleForm = {

                interview_date: "",
                start_time: "",
                end_time: "",
                number_of_panels: 1

            };

        },


        cancelSchedule(){

            this.scheduleDriveId = null;

            this.scheduleForm = {

                interview_date: "",
                start_time: "",
                end_time: "",
                number_of_panels: 1

            };

        },


        async scheduleInterviews(){

            try{

                
                const driveId = this.scheduleDriveId;


                if(!driveId){

                    throw new Error(
                        "Drive ID is missing"
                    );

                }


                // Create FormData
                const formData = new FormData();

                formData.append(
                    "drive_id",
                    driveId
                );

                formData.append(
                    "interview_date",
                    this.scheduleForm.interview_date
                );

                formData.append(
                    "start_time",
                    this.scheduleForm.start_time
                );

                formData.append(
                    "end_time",
                    this.scheduleForm.end_time
                );

                formData.append(
                    "number_of_panels",
                    this.scheduleForm.number_of_panels
                );
                formData.append(
                    "average_time",
                    this.scheduleForm.average_time
                );



                console.log(
                    "Scheduling:",
                    driveId,
                    this.scheduleForm
                );


                const res = await fetch(
                    `http://127.0.0.1:5000/company/schedule-interviews`,
                    {
                        method: "POST",
                        credentials: "include",
                        body: formData
                    }
                );


                const data = await res.json();


                if(!res.ok || !data.success){

                    throw new Error(
                        data.message ||
                        "Failed to schedule interviews"
                    );

                }


                this.message =
                    data.message ||
                    "Interviews scheduled successfully";


                // Close form
                this.scheduleDriveId = null;


                // Reset form
                this.scheduleForm = {

                    interview_date: "",
                    start_time: "",
                    end_time: "",
                    number_of_panels: 1

                };


            }
            catch(err){

                this.message = err.message;

                console.log(err);

            }

        }

    }

}).mount("#app");

</script>

</body>
</html>
