<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Drives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .sidebar {
            height: 100vh;
            background-color: #0f172a;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>
            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="edit-drives.html">Edit Drives</a>
            <a href="company-studentapplications.html">Applications</a>
            <a href="company-profile.html">Profile</a>
        </div>

        <div class="col-md-10 p-4">
            <h2>Edit Drives</h2>
            <hr>
            <p v-if="message">{{message}}</p>

            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Drive Name</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="d in drives" :key="d.drive_id">
                        <td>{{ d.Name }}</td>
                        <td>
                            <span class="badge" :class="d.applications_closed ? 'bg-secondary' : 'bg-success'">
                                {{ d.status }}
                            </span>
                        </td>
                        <td class="text-center">
                            <button class="btn btn-primary btn-sm me-2" >
                                <a :href="'add-drivedetails.html?id=' + d.id">Edit</a>
                            </button>
                            <button
                                class="btn btn-warning btn-sm me-2"
                                :disabled="d.applications_closed"
                                @click="closeApplications(d.drive_id)"
                            >
                                Close Applications
                            </button>
                            <button class="btn btn-danger btn-sm" @click="deleteDrive(d.drive_id)">
                                Delete
                            </button>
                        </td>
                    </tr>
                    <tr v-if="drives.length === 0">
                        <td colspan="3" class="text-center text-muted">No drives found</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script>
    const {createApp} = Vue;
    createApp({
        data(){
            return {
                drives:[],
                user_name:"",
                message:"",
            }
        },
        created(){
            this.fetchDrives();
        },
        methods:{
            async fetchDrives(){
                try{
                    const res = await fetch(`http://127.0.0.1:5000/company/view-drives`,{
                        credentials:'include'
                    });
                    if(!res.ok) throw new Error("something went wrong");
                    const data = await res.json();
                    if(!data.success) throw new Error(data.message);
                    this.drives = data.drives;
                    this.user_name = data.user_name;
                }catch(err){
                    this.message = err;
                    console.log(err);
                }
            },
            editDrive(driveId){
                window.location.href = `edit-drive.html?id=${driveId}`;
            },
            async closeApplications(driveId){
                if(!confirm("Close applications for this drive?")) return;
                try{
                    const res = await fetch(`http://127.0.0.1:5000/company/edit-drives/${driveId}`,{
                        method:'POST',
                        credentials:'include'
                    });
                    const data = await res.json();
                    if(!data.success) throw new Error(data.message);
                    const drive = this.drives.find(d => d.drive_id === driveId);
                    if(drive) drive.applications_closed = true;
                    this.message = "Applications closed successfully";
                }catch(err){
                    this.message = err;
                    console.log(err);
                }
            },
            async deleteDrive(driveId){
                if(!confirm("Are you sure you want to delete this drive? This cannot be undone.")) return;
                try{
                    const res = await fetch(`http://127.0.0.1:5000/company/drives/${driveId}`,{
                        method:'DELETE',
                        credentials:'include'
                    });
                    const data = await res.json();
                    if(!data.success) throw new Error(data.message);
                    this.drives = this.drives.filter(d => d.drive_id !== driveId);
                    this.message = "Drive deleted successfully";
                }catch(err){
                    this.message = err;
                    console.log(err);
                }
            }
        }
    }).mount("#app");
</script>
</body>
</html>
