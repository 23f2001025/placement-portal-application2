<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Placement Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .sidebar {
            height: 100vh;
            background-color: #0f172a;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #1e293b;
        }
        .error{
            color: red;
            font-weight: bold;
        }
        .success{
            color: green;
            font-weight: bold;
        }
        .field-row {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .field-row.dirty {
            border-color: #f0ad4e;
            background: #fffaf0;
        }
        .field-label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 2px;
        }
        .field-value {
            font-size: 1rem;
            color: #0f172a;
            word-break: break-word;
        }
        .dirty-badge {
            font-size: 0.7rem;
            color: #b45309;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>
            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="edit-drives.html">Drives</a>
            <a href="company-profile.html">Profile</a>
        </div>

        <div class="col-md-10 p-4">
            <h2>Edit Placement Drive</h2>
            <hr>
            <p class="error" v-if="message.length">{{ message }}</p>
            <p class="success" v-if="successMessage.length">{{ successMessage }}</p>

            <div v-if="loading">Loading drive details...</div>

            <template v-else>

                <div class="field-row" :class="{ dirty: editedFields.has(f.key) }" v-for="f in fields" :key="f.key">
                    <div>
                        <div class="field-label">
                            {{ f.label }}
                            <span class="dirty-badge" v-if="editedFields.has(f.key)">● edited</span>
                        </div>
                        <div class="field-value">{{ drive[f.key] }}</div>
                    </div>
                    <button class="btn btn-outline-primary btn-sm" @click="openEdit(f)">
                        Edit
                    </button>
                </div>

                <div class="d-grid gap-2 d-md-flex mt-4">
                    <button
                        class="btn btn-primary"
                        :disabled="saving || editedFields.size === 0"
                        @click="updateDrive"
                    >
                        {{ saving ? "Saving..." : `Save Changes (${editedFields.size})` }}
                    </button>
                    <a href="edit-drives.html" class="btn btn-secondary">Back</a>
                </div>

            </template>

        </div>
    </div>

    <!-- Edit field modal -->
    <div class="modal fade" id="editFieldModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit {{ editingField ? editingField.label : "" }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <textarea
                        v-if="editingField && editingField.multiline"
                        class="form-control"
                        rows="4"
                        v-model="editingValue"
                    ></textarea>
                    <input
                        v-else
                        type="text"
                        class="form-control"
                        v-model="editingValue"
                    >
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" @click="saveFieldEdit">Save</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/scripts/add-drivedetails.js">
    
</script>

</body>
</html>
