<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blacklist - Placement Cell</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .sidebar {
            height: 100vh;
            background-color: #1e293b;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #334155;
        }
        .sidebar a.active {
            background-color: #334155;
            font-weight: 600;
        }
        .card { margin-bottom: 20px; }
        .error{
            color: red;
            font-weight: bold;
        }
        .success{
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Admin Panel"}}</h4>
            <hr>
            <a href="admindash.html">Dashboard</a>
            <a href="admin-company.html">Manage Companies</a>
            <a href="admin-placementdrive.html">Placement Drives</a>
            <a href="admin-student.html">Students</a>
            <a href="admin-blacklist.html" class="active">Blacklist</a>
           
        </div>

        <div class="col-md-10 p-4">
            <h2>Blacklisted Companies & Students</h2>
            <hr>

            <p class="error" v-if="message.length">{{ message }}</p>
            <p class="success" v-if="successMessage.length">{{ successMessage }}</p>

            <div v-if="loading">Loading blacklist...</div>

            <template v-else>

                <h4>Blacklisted Companies</h4>
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Company Name</th>
                            <th>Email</th>
                            <th>Registered On</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="c in blacklistedCompanies" :key="c.company_id">
                            <td>{{ c.name }}</td>
                            <td>{{ c.email || "-" }}</td>
                            <td>{{ c.registered_on || "-" }}</td>
                            <td class="text-center">
                                <button
                                    class="btn btn-success btn-sm"
                                    :disabled="removingId === c.id"
                                    @click="removeFromBlacklist('company', c.id)"
                                >
                                    {{ removingId === c.company_id ? "Removing..." : "Remove from Blacklist" }}
                                </button>
                            </td>
                        </tr>
                        <tr v-if="blacklistedCompanies.length === 0">
                            <td colspan="4" class="text-center text-muted">No blacklisted companies</td>
                        </tr>
                    </tbody>
                </table>

                <h4 class="mt-5">Blacklisted Students</h4>
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Enrollment No.</th>
                            <th>Branch</th>
                            <th>Semester</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="s in blacklistedStudents" :key="s.enrollment">
                            <td>{{ s.name }}</td>
                            <td>{{ s.enroll_no }}</td>
                            <td>{{ s.branch }}</td>
                            <td>{{ s.sem || "-" }}</td>
                            <td class="text-center">
                                <button
                                    class="btn btn-success btn-sm"
                                    :disabled="removingId === s.enroll_no"
                                    @click="removeFromBlacklist('student', s.enroll_no)"
                                >
                                    {{ removingId === s.student_id ? "Removing..." : "Remove from Blacklist" }}
                                </button>
                            </td>
                        </tr>
                        <tr v-if="blacklistedStudents.length === 0">
                            <td colspan="5" class="text-center text-muted">No blacklisted students</td>
                        </tr>
                    </tbody>
                </table>

            </template>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/scripts/admin-blakclist.js">
    
</script>
</body>
</html>
