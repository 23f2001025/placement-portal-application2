<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
        }
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.08);
        }
        .error{
            color: red;
            font-weight: bold;
        }
        .success{
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-card" id="app">
    <h3 class="text-center mb-4">Student Login</h3>

    <form  @submit.prevent="login">
        <div class="mb-3">
            <label class="form-label">username</label>
            <input type="text" class="form-control" v-model= "username"  required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" v-model="password" required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success">Login</button>
        </div>

        <p v-if="message.length">{{message}}</p>


    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script>
    const {createApp} = Vue;
    createApp({
        data(){
            return {
                username:"",
                password:"",
                message:"",
            }
        },
        methods:{
            async login(){
                try{
                    const res = await fetch(`http://127.0.0.1:5000/student/login`,{
                        method:'POST',
                        headers:{
                            'Content-Type':'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            "enroll_no":this.username,
                            "password":this.password,
                        })
                    });
                    
                    if(!res.ok) throw new Error('Failed to create drive');
                    const data = await res.json();
                    console.log(data);
                    if(!data.success){
                        this.message= data.message;
                        return;
                    }
                    console.log(data);
                    this.message = "Login Successfull , Redirecting to dashboard!"
                    window.location.href = 'student-dash.html';
                }catch(err){
                    console.log(err);
                    this.message = err;
                }
                
            } 
        }
    }).mount("#app")
</script>
</body>
</html>
