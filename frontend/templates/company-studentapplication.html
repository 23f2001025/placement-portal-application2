<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .sidebar {
            height: 100vh;
            background-color: #1e293b;
            color: white;
        }
        .sidebar h4 { font-size: 1.1rem; }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #334155;
        }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

       
        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>
            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="edit-drive.html">Drives</a>
            <a href="company-profile.html">Profile</a>
        </div>

        
        <div class="col-md-10 p-4">

            <p :class="messageCategory" v-if="message.length">{{ message }}</p>

            <h2>Student Applications</h2>
            <hr>

            <template v-if="applications.length">
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Student Name</th>
                        <th>Branch</th>
                        <th>CGPA</th>
                        <th>Drive</th>
                        <th>Status</th>
                        <th>Resume</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="app in applications" :key="app.id">
                        <td>{{ app.student_name }}</td>
                        <td>{{ app.branch }}</td>
                        <td>{{ app.cgpa }}</td>
                        <td>{{ app.drive_title }}</td>
                        <td>{{ app.status }}</td>
                        <td>
                            <a v-if="app.resume" :href="`http://127.0.0.1:5000/company/student-resume/${app.student_id}/${app.drive_id}`" target="_blank">
                                    View Resume
                                </a>
                            <span class="text-muted" v-else>Not uploaded</span>
                        </td>
                        <td>
                            <form @submit.prevent="handleApplicationAction(app.id, 'shortlist')" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm">Shortlist</button>
                            </form>

                            <form @submit.prevent="handleApplicationAction(app.id, 'remove')" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </template>
            <p v-else>No applications found.</p>


            <template v-if="shortlisted.length">
            <h2>Shortlisted Students</h2>
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Student Name</th>
                        <th>Branch</th>
                        <th>CGPA</th>
                        <th>Drive</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="app in shortlisted" :key="app.id">
                        <td>{{ app.student_name }}</td>
                        <td>{{ app.branch }}</td>
                        <td>{{ app.cgpa }}</td>
                        <td>{{ app.drive_title }}</td>
                        <td>{{ app.status }}</td>
                        <td>
                            <form @submit.prevent="handleApplicationAction(app.id, 'remove')" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </template>
            <p v-else>No applications found.</p>


        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script>
    const {createApp} = Vue
    createApp({
        data(){
            return {
                user_name:"",
                applications:[],
                shortlisted:[],
                message:"",
                messageCategory:"",
            }
        },
        created(){
            this.fetchApplications();
        },
        methods:{
            async fetchApplications(){
                try{
                    const res = await fetch(`http://127.0.0.1:5000/company/applications`,{
                        credentials:"include",
                    });
                    if(!res.ok) throw new Error("Failed to fetch applications");
                    const data = await res.json();
                    this.user_name = data.user_name;
                    this.applications = data.applications;
                    this.shortlisted = data.shortlisted;
                }catch(err){
                    this.message = err.message;
                    this.messageCategory = "error";
                    console.log(err);
                }
            },
            async handleApplicationAction(application_id, action){
                try{
                    const formData = new FormData();
                    formData.append("application_id", application_id);
                    formData.append("action", action);
                    console.log(application_id,action);
                    const res = await fetch(`http://127.0.0.1:5000/company/applications`,{
                        method:"POST",
                        credentials:"include",
                        body: formData,
                    });
                    const data = await res.json();
                    if(!res.ok || !data.success) throw new Error(data.message || "Failed to update application");
                    this.message = data.message;
                    this.messageCategory = "success";
                    this.fetchApplications();
                }catch(err){
                    this.message = err.message;
                    this.messageCategory = "error";
                    console.log(err);
                }
            }
        }
    }).mount("#app");
</script>

</body>
</html>
