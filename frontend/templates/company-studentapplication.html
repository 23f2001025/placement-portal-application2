<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; }
        .sidebar {
            height: 100vh;
            background-color: #1e293b;
            color: white;
        }
        .sidebar h4 { font-size: 1.1rem; }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #334155;
        }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

<div class="container-fluid" id="app">
    <div class="row">

       
        <div class="col-md-2 sidebar p-3">
            <h4>{{user_name || "Company Panel"}}</h4>
            <hr>
            <a href="company-dash.html">Dashboard</a>
            <a href="create-drive.html">Create Drive</a>
            <a href="company-studentapplication.html">Applications</a>
            <a href="edit-drive2.html">Drives</a>
            <a href="company-profile.html">Profile</a>
        </div>

        
        <div class="col-md-10 p-4">

            <p :class="messageCategory" v-if="message.length">{{ message }}</p>

            <h2>Student Applications</h2>
            <hr>

            <template v-if="applications.length">
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Student Name</th>
                        <th>Branch</th>
                        <th>CGPA</th>
                        <th>Drive</th>
                        <th>Status</th>
                        <th>Resume</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="app in applications" :key="app.id">
                        <td>{{ app.student_name }}</td>
                        <td>{{ app.branch }}</td>
                        <td>{{ app.cgpa }}</td>
                        <td>{{ app.drive_title }}</td>
                        <td>{{ app.status }}</td>
                        <td>
                            <button v-if="app.resume" class="btn btn-outline-success btn-sm" @click="viewResume(app.id)">
                                Resume
                            </button>
                            <span class="text-muted" v-else>Not uploaded</span>
                        </td>
                        <td>
                            <form @submit.prevent="handleApplicationAction(app.id, 'shortlist')" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm">Shortlist</button>
                            </form>

                            <form @submit.prevent="handleApplicationAction(app.id, 'remove')" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </template>
            <p v-else>No applications found.</p>


            <template v-if="shortlisted.length">
            <h2>Shortlisted Students</h2>
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Student Name</th>
                        <th>Branch</th>
                        <th>CGPA</th>
                        <th>Drive</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="app in shortlisted" :key="app.id">
                        <td>{{ app.student_name }}</td>
                        <td>{{ app.branch }}</td>
                        <td>{{ app.cgpa }}</td>
                        <td>{{ app.drive_title }}</td>
                        <td>{{ app.status }}</td>
                        <td>
                            <form @submit.prevent="handleApplicationAction(app.id, 'remove')" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </template>
            <p v-else>No applications found.</p>


            <template v-if="interviewScheduled.length">
            <h2>Interview Scheduled Students</h2>
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>Student Name</th>
                        <th>Drive</th>
                        <th>Interview Date</th>
                        <th>Time</th>
                        <th>Panel</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="app in interviewScheduled" :key="app.id">
                        <td>{{ app.student_name }}</td>
                        <td>{{ app.drive_title }}</td>
                        <td>{{ app.date }}</td>
                        <td>{{ app.start }} </td>
                        <td>{{ app.panel_no }}</td>
                        <td>
                            <form @submit.prevent="handleApplicationAction(app.id, 'select')" style="display:inline;">
                                <button type="submit" class="btn btn-success btn-sm">Select</button>
                            </form>

                            <form @submit.prevent="handleApplicationAction(app.id, 'reject')" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </template>
            <p v-else>No interviews scheduled.</p>


            <template v-if="selected.length">
            <h2>Selected Students</h2>
            <table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
        <tr>
            <th>Student Name</th>
            <th>Drive</th>
            <th>Status</th>
            <th>Offer Letter</th>
        </tr>
    </thead>
    <tbody>
        <tr v-for="app in selected" :key="app.id">
            <td>{{ app.student_name }}</td>
            <td>{{ app.drive_title }}</td>
            <td>{{ app.status }}</td>

            <td>
                <a v-if="app.offer_letter" :href="`http://127.0.0.1:5000/company/offer-letter/${app.id}`" target="_blank" class="btn btn-outline-success btn-sm">
                    View Uploaded Offer
                </a>
                <button v-else class="btn btn-primary btn-sm" @click="openOfferModal(app.id)">
                    Upload Offer
                </button>
            </td>
        </tr>
    </tbody>
</table>
</template>
            <p v-else>No students selected yet.</p>

<!-- Upload modal -->
<div class="modal fade" id="offerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Upload Offer Letter</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="file" class="form-control" accept="application/pdf" @change="onOfferFileSelected">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" :disabled="uploadingOffer" @click="uploadOfferLetter">
                    {{ uploadingOffer ? "Uploading..." : "Upload" }}
                </button>
            </div>
        </div>
    </div>
</div>
            


        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
<script src="/scripts/company-studentapplication.js">
    
</script>

</body>
</html>
